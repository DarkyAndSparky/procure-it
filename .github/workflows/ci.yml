name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: Syntax & install check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server.js
        run: node --check server.js

      - name: Syntax check public/zakupki.html (extract scripts)
        run: |
          # Extract inline <script> blocks and check each for syntax errors
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/zakupki.html', 'utf8');
            const scripts = [...html.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/gi)];
            let errors = 0;
            scripts.forEach((m, i) => {
              try { new Function(m[1]); }
              catch(e) { console.error('Script block', i+1, ':', e.message); errors++; }
            });
            if (errors) process.exit(1);
            console.log('All', scripts.length, 'inline script blocks OK');
          "
