<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сброс пароля</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      color: #111;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .icon { font-size: 36px; text-align: center; margin-bottom: 10px; }
    h1 { font-size: 18px; font-weight: 700; text-align: center; margin: 0 0 6px; }
    .sub { font-size: 13px; color: #666; text-align: center; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; color: #333; }
    input[type=password] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input[type=password]:focus { border-color: #2563eb; }
    .field { margin-bottom: 14px; }
    .btn {
      display: block;
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #93c5fd; cursor: default; }
    .error { color: #dc2626; font-size: 12px; margin-top: 10px; display: none; }
    .success { text-align: center; display: none; }
    .success .check { font-size: 48px; margin-bottom: 12px; }
    .success p { font-size: 14px; color: #555; margin: 0 0 20px; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #2563eb; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .expired { text-align: center; display: none; }
    .expired .icon2 { font-size: 40px; margin-bottom: 10px; }
    .expired p { font-size: 14px; color: #555; }
  </style>
</head>
<body>
<div class="card">
  <div id="view-form">
    <div class="icon">🔐</div>
    <h1>Новый пароль</h1>
    <p class="sub">Введите новый пароль для вашей учётной записи</p>
    <div class="field">
      <label for="pw-new">Новый пароль</label>
      <input type="password" id="pw-new" placeholder="минимум 6 символов" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="pw-confirm">Повторите пароль</label>
      <input type="password" id="pw-confirm" placeholder="••••••••" autocomplete="new-password"
             onkeydown="if(event.key==='Enter')doReset()">
    </div>
    <div class="error" id="err"></div>
    <button class="btn" id="submit-btn" onclick="doReset()">Сохранить пароль</button>
  </div>

  <div class="success" id="view-success">
    <div class="check">✅</div>
    <h1>Пароль изменён</h1>
    <p>Вы можете войти в систему с новым паролем.</p>
    <a class="back" href="/">← Войти</a>
  </div>

  <div class="expired" id="view-expired">
    <div class="icon2">⏰</div>
    <h1>Ссылка недействительна</h1>
    <p id="expired-msg">Ссылка истекла или уже была использована.<br>Запросите сброс пароля заново.</p>
    <a class="back" href="/">← На главную</a>
  </div>
</div>

<script>
  const token = new URLSearchParams(location.search).get('token');

  if (!token) {
    document.getElementById('view-form').style.display = 'none';
    document.getElementById('view-expired').style.display = 'block';
    document.getElementById('expired-msg').textContent = 'Ссылка недействительна — токен не найден.';
  }

  async function doReset() {
    const pw      = document.getElementById('pw-new').value;
    const confirm = document.getElementById('pw-confirm').value;
    const errEl   = document.getElementById('err');
    const btn     = document.getElementById('submit-btn');

    errEl.style.display = 'none';

    if (!pw || !confirm) { showErr('Заполните оба поля'); return; }
    if (pw.length < 6)   { showErr('Минимум 6 символов'); return; }
    if (pw !== confirm)  { showErr('Пароли не совпадают'); return; }

    btn.disabled = true;
    btn.textContent = 'Сохраняем…';

    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: pw }),
      });
      const data = await r.json();
      if (data.ok) {
        document.getElementById('view-form').style.display = 'none';
        document.getElementById('view-success').style.display = 'block';
      } else {
        showErr(data.error || 'Ошибка');
        btn.disabled = false;
        btn.textContent = 'Сохранить пароль';
      }
    } catch(e) {
      showErr('Ошибка соединения');
      btn.disabled = false;
      btn.textContent = 'Сохранить пароль';
    }
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
